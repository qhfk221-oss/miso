<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>정미소 · 입문코치 디지털 명함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* KB 공식 CI 컬러: 메인(KB Gray 딥 브라운) + 포인트(KB Yellow/Gold) */
      --main: #534B3E;
      --main-deep: #3B352B;
      --main-soft: #645B4C;
      --accent: #D69600;
      --accent-soft: rgba(252, 175, 23, 0.15);

      --white: #FFFFFF;
      --surface: #FAFBFC;
      --bg-top: #F7F8FA;
      --bg-bottom: #ECEFF4;
      --gray-50: #F4F5F7;
      --gray-100: #E8EBEF;
      --gray-200: #D8DEE6;
      --gray-400: #8D96A5;
      --gray-600: #5A6372;
      --gray-900: #1A1F29;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--gray-900);
      background: #E4E8EF;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* 데스크톱: 가운데 9:16 둥근 폰 프레임 */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--white) 52%, var(--bg-bottom) 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 500px) {
      .phone-frame {
        height: min(100dvh - 32px, 860px);
        aspect-ratio: 9 / 16;
        width: auto;
        max-width: 430px;
        border-radius: 38px;
        box-shadow:
          0 32px 80px rgba(15, 25, 43, 0.22),
          0 10px 28px rgba(15, 25, 43, 0.12),
          inset 0 0 0 1px rgba(255, 255, 255, 0.85);
      }
    }

    /* 배경 은은한 원형 빛 (오른쪽 위, 왼쪽 아래) */
    .bg-glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow--tr {
      width: 280px;
      height: 280px;
      top: -90px;
      right: -85px;
      background: radial-gradient(circle, rgba(252, 175, 23, 0.16) 0%, rgba(252, 175, 23, 0) 70%);
    }

    .bg-glow--bl {
      width: 300px;
      height: 300px;
      bottom: -100px;
      left: -95px;
      background: radial-gradient(circle, rgba(100, 91, 76, 0.12) 0%, rgba(100, 91, 76, 0) 70%);
    }

    /* 상단 바 */
    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + var(--safe-top)) 22px 18px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.96) 0%,
        rgba(255, 255, 255, 0.82) 62%,
        rgba(255, 255, 255, 0) 100%
      );
      flex-shrink: 0;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--gray-100);
      background: var(--white);
      box-shadow: 0 4px 12px rgba(24, 38, 62, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--main);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .back-btn:active {
      transform: scale(0.92);
      box-shadow: 0 2px 6px rgba(24, 38, 62, 0.08);
    }

    .topbar-title {
      text-align: right;
      line-height: 1.25;
    }

    .topbar-title__main {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.02em;
    }

    .topbar-title__sub {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--accent);
      margin-right: -0.32em;
    }

    /* 카드 영역만 세로 스크롤 + 스크롤바 숨김 */
    .card-scroll-area {
      position: relative;
      z-index: 2;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 18px calc(92px + var(--safe-bottom));
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .card-scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* 명함 카드 */
    .business-card {
      position: relative;
      width: 100%;
      max-width: 372px;
      margin: 0 auto;
      border-radius: 30px;
      background: var(--surface);
      padding-bottom: 12px;
      box-shadow:
        0 26px 56px -12px rgba(24, 38, 62, 0.20),
        0 10px 24px -8px rgba(24, 38, 62, 0.10),
        0 0 0 1px rgba(255, 255, 255, 0.9);
      overflow: hidden;

      /* 등장 애니메이션: 아래에서 72px 올라오며 등장 (1.35s) */
      opacity: 0;
      transform: translateY(72px);
      animation: cardEnter 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(72px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 0.7초 뒤 흰 빛줄기가 카드 위를 왼쪽에서 오른쪽으로 비스듬히 스쳐 지나감 (2.1초) */
    .card-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
      border-radius: 30px;
    }

    .card-sheen::after {
      content: '';
      position: absolute;
      top: -30%;
      left: -80%;
      width: 55%;
      height: 160%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.36) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-22deg);
      animation: sheenSweep 2.1s cubic-bezier(0.25, 0.8, 0.25, 1) 0.7s 1 forwards;
    }

    @keyframes sheenSweep {
      0% {
        left: -80%;
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        left: 150%;
        opacity: 0;
      }
    }

    /* 1) 헤더 밴드 */
    .card-band {
      position: relative;
      height: 168px;
      padding: 26px 24px 0;
      background: linear-gradient(135deg, var(--main-deep) 0%, var(--main) 52%, var(--main-soft) 100%);
      overflow: hidden;
    }

    .band-light {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .band-light--one {
      width: 170px;
      height: 170px;
      top: -65px;
      right: -45px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 70%);
    }

    .band-light--two {
      width: 150px;
      height: 150px;
      bottom: -65px;
      left: -40px;
      background: radial-gradient(circle, rgba(252, 175, 23, 0.28) 0%, rgba(252, 175, 23, 0) 72%);
    }

    .band-title {
      position: relative;
      z-index: 2;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--white);
      line-height: 1.08;
    }

    .band-subtitle {
      position: relative;
      z-index: 2;
      margin-top: 7px;
      font-size: 9.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.44em;
      color: rgba(255, 255, 255, 0.68);
    }

    /* 2) 흰 시트 */
    .card-sheet {
      position: relative;
      z-index: 5;
      margin: -38px 11px 0;
      background: var(--white);
      border-radius: 25px;
      padding: 62px 20px 22px;
      box-shadow:
        0 12px 32px rgba(24, 38, 62, 0.08),
        0 2px 8px rgba(24, 38, 62, 0.04);
    }

    /* 3) 프로필 사진 */
    .avatar-wrap {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid var(--white);
      background: var(--gray-100);
      box-shadow: 0 10px 24px rgba(24, 38, 62, 0.16);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    .avatar-fallback {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--main) 0%, var(--main-soft) 100%);
      color: var(--white);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    /* 4) 이름 & 직함 */
    .profile-head {
      text-align: center;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 900;
      color: var(--gray-900);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .profile-tagline {
      margin-top: 7px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--gray-600);
      word-break: keep-all;
    }

    .profile-role {
      color: var(--accent);
      font-weight: 700;
    }

    /* 5) 액션 버튼 4개 (4칸 그리드) */
    .action-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      justify-items: center;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      color: var(--gray-600);
      transition: transform 0.15s ease;
    }

    .action-item:active {
      transform: scale(0.93);
    }

    .action-box {
      width: 51px;
      height: 51px;
      border-radius: 15px;
      background: var(--gray-50);
      border: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--main);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .action-item:hover .action-box {
      background: var(--accent-soft);
      border-color: rgba(252, 175, 23, 0.45);
    }

    .action-label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--gray-600);
    }

    /* 6) 가는 구분선 1px */
    .sheet-divider {
      height: 1px;
      background: var(--gray-100);
      margin: 22px 0 6px;
      border: none;
    }

    /* 7) 정보 리스트 */
    .info-list {
      list-style: none;
    }

    .info-item {
      border-bottom: 1px solid var(--gray-100);
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-link,
    .info-static {
      display: block;
      padding: 14px 2px;
      text-decoration: none;
      color: inherit;
    }

    .info-link {
      transition: opacity 0.15s ease;
    }

    .info-link:active {
      opacity: 0.65;
    }

    .info-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--gray-400);
      margin-bottom: 4px;
    }

    .info-value {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-900);
      line-height: 1.5;
      word-break: break-word;
    }

    /* 공유 버튼: 오른쪽 아래 고정, 지름 54px, 1.2초 뒤 아래에서 떠오르며 나타남 */
    .share-fab {
      position: absolute;
      right: 22px;
      bottom: calc(22px + var(--safe-bottom));
      z-index: 30;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--main) 0%, var(--main-soft) 100%);
      color: var(--white);
      box-shadow:
        0 14px 28px rgba(24, 38, 62, 0.28),
        0 4px 10px rgba(24, 38, 62, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;

      opacity: 0;
      transform: translateY(28px);
      animation: fabRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      transition: transform 0.16s ease;
    }

    .share-fab:active {
      transform: scale(0.92);
    }

    @keyframes fabRise {
      0% {
        opacity: 0;
        transform: translateY(28px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 토스트 메시지 */
    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(90px + var(--safe-bottom));
      transform: translateX(-50%) translateY(16px);
      z-index: 40;
      background: rgba(59, 53, 43, 0.94);
      color: var(--white);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(15, 25, 43, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="bg-glow bg-glow--tr" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--bl" aria-hidden="true"></div>

    <!-- 상단 바 -->
    <header class="topbar">
      <button type="button" class="back-btn" id="backBtn" aria-label="뒤로가기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="topbar-title">
        <span class="topbar-title__main">명함</span>
        <span class="topbar-title__sub">BUSINESS CARD</span>
      </div>
    </header>

    <!-- 카드 스크롤 영역 -->
    <main class="card-scroll-area">
      <article class="business-card" aria-label="정미소 디지털 명함">
        <div class="card-sheen" aria-hidden="true"></div>

        <!-- 1) 헤더 밴드 -->
        <div class="card-band">
          <div class="band-light band-light--one" aria-hidden="true"></div>
          <div class="band-light band-light--two" aria-hidden="true"></div>
          <h1 class="band-title">JEONG MISO</h1>
          <p class="band-subtitle">ONBOARDING COACH</p>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var toastEl = document.getElementById('toast');
      var toastTimer = null;

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('is-visible');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('is-visible');
        }, 2400);
      }

      // 프로필 이미지 로드 실패 시 이니셜 폴백 표시
      var profileImg = document.getElementById('profileImg');
      var avatarFallback = document.getElementById('avatarFallback');
      profileImg.addEventListener('error', function () {
        profileImg.style.display = 'none';
        avatarFallback.style.display = 'flex';
      });

      // 뒤로가기 버튼
      document.getElementById('backBtn').addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          showToast('이전 화면이 없습니다');
        }
      });

      // vCard (.vcf) 저장
      document.getElementById('saveVcfBtn').addEventListener('click', function () {
        var vcfLines = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'N:정;미소;;;',
          'FN:정미소',
          'ORG:KB손해보험',
          'TITLE:입문코치',
          'TEL;TYPE=CELL,VOICE:010-5901-2422',
          'EMAIL;TYPE=INTERNET:3289017@kbinsure.co.kr',
          'END:VCARD'
        ].join('\r\n');

        var blob = new Blob([vcfLines], { type: 'text/vcard;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = '정미소_입문코치.vcf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);

        showToast('연락처가 저장되었습니다');
      });

      // 공유 버튼 (navigator.share -> 실패/미지원 시 주소 복사 + 토스트)
      function copyUrlFallback(text) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          // ignore
        }
        document.body.removeChild(textarea);
      }

      document.getElementById('shareBtn').addEventListener('click', function () {
        var shareUrl = window.location.href;
        var shareData = {
          title: '정미소 · 입문코치 디지털 명함',
          text: 'KB손해보험 정미소 입문코치 디지털 명함입니다.',
          url: shareUrl
        };

        if (navigator.share) {
          navigator.share(shareData).catch(function (err) {
            if (err && err.name === 'AbortError') return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(shareUrl).then(function () {
                showToast('명함 주소가 복사되었습니다');
              }).catch(function () {
                copyUrlFallback(shareUrl);
                showToast('명함 주소가 복사되었습니다');
              });
            } else {
              copyUrlFallback(shareUrl);
              showToast('명함 주소가 복사되었습니다');
            }
          });
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(function () {
            showToast('명함 주소가 복사되었습니다');
          }).catch(function () {
            copyUrlFallback(shareUrl);
            showToast('명함 주소가 복사되었습니다');
          });
        } else {
          copyUrlFallback(shareUrl);
          showToast('명함 주소가 복사되었습니다');
        }
      });
    })();
  </script>
